aid: instabeat
name: Instabeat
description: Instabeat is a San Francisco based swimming technology company that builds
  a heart-rate monitoring device integrated directly into swim goggles, giving swimmers
  real-time, color-coded effort feedback (heart-rate zones), automatic stroke detection,
  lap counting, pace, distance and rest-interval tracking without a chest strap or
  wrist watch. Paired with the Instabeat mobile app and myinstabeat.com, it delivers
  data-driven training insights so swimmers can adjust workouts in the water rather
  than after the session. The company sells the device through a Shopify storefront
  and has tested the product with 250+ swimmers across 56 countries. Added to the
  API Evangelist network as a 500 Global portfolio company; no public developer or
  API surface has been identified.
